[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "An open-source, provider-agnostic LangGraph deep research agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Deep Research contributors" }]
keywords = ["langgraph", "deep-research", "multi-agent", "fastapi", "open-source"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "pydantic>=2.13.5,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
production = [
  "langgraph-checkpoint-postgres>=2.0,<4",
  "psycopg[binary]>=3.2,<4",
]
observability = [
  "langfuse[langchain]>=2,<3",
  "litellm>=1.50,<2",
]
local = [
  "huggingface-hub>=0.25,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "langfuse[langchain]>=2,<3",
  "langchain>=0.2,<1",
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "api*",
  "caching*",
  "clarify*",
  "compression*",
  "infra*",
  "reporting*",
  "research_brief*",
  "researcher*",
  "state*",
  "supervisor*",
  "verification*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F541", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)(tests|frontend)/"
