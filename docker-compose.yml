services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://deepresearch:deepresearch@postgres:5432/deepresearch
      CORS_ORIGINS: http://localhost:3000
      PROVIDER_CONFIG_FILE: config/providers.json
    volumes:
      - ./config:/app/config:ro
      - report_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deepresearch
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: deepresearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  report_data:
